# Architecture, Deployment: on every push, npm ci → biome ci → tsc --noEmit → vitest run
# → vite build → size check. Deployment from main comes in epic 6.
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npx biome ci .
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Size check
        run: node scripts/check-size.ts
